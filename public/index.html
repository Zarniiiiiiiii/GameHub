<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Your Gaming Paradise</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">GameHub</div>
            <div class="search-bar">
                <input type="text" placeholder="Search games...">
            </div>
            <div class="auth-buttons">
                <button id="loginBtn">Login</button>
                <button id="signupBtn">Sign Up</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="featured-games">
            <h2>Featured Games</h2>
            <div class="games-grid" id="featuredGames">
                <!-- Games will be loaded here dynamically -->
            </div>
        </section>

        <section class="all-games">
            <h2>All Games</h2>
            <div class="games-grid" id="allGames">
                <!-- Games will be loaded here dynamically -->
            </div>
        </section>

        <section class="leaderboard">
            <h2>Top Scores</h2>
            <div id="leaderboard">
                <!-- Leaderboard will be loaded here dynamically -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 GameHub. All rights reserved.</p>
    </footer>

    <script type="module" src="js/firebase/config.js"></script>
    <script type="module" src="js/firebase/database.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
